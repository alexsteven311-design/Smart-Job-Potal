# disabled for local frontend dev to use in-memory H2
# spring.profiles.active=mysql
spring.datasource.url=jdbc:h2:file:./data/smartjobdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

jwt.secret=ReplaceThisWithAReallyLongAndSecureSecretKeyStringThatIsAtLeastSixtyFourCharactersLong
jwt.expiration-ms=604800000
resume.upload.dir=uploads/resumes

spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.connectiontimeout=2000
spring.mail.properties.mail.smtp.timeout=2000
spring.mail.properties.mail.smtp.writetimeout=2000

server.port=${SERVER_PORT:8082}

# AI feedback via AWS Bedrock (set ai.feedback.enabled=true and configure AWS credentials to activate)
ai.feedback.enabled=false
ai.feedback.bedrock.region=us-east-1
ai.feedback.bedrock.model-id=anthropic.claude-3-haiku-20240307-v1:0

# Serve Angular build output from the browser bundle first, with static as fallback
spring.web.resources.static-locations=classpath:/static/browser/,classpath:/static/
